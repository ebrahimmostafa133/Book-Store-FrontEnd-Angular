<div class="flex h-screen overflow-hidden font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
  
  <!-- Sidebar -->
  <aside class="w-64 border-r border-slate-200 dark:border-slate-800 flex flex-col bg-white dark:bg-slate-900/50">
    <nav class="flex-1 px-4 space-y-1 overflow-y-auto mt-6">
      <p class="px-2 mb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Catalog Management</p>
      
      <a routerLink="/admin/dashboard" routerLinkActive="bg-primary/10 text-primary font-bold dark:bg-primary/20" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
        <span class="material-symbols-outlined text-[1.3rem]">dashboard</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/admin/books" routerLinkActive="bg-primary/10 text-primary font-bold dark:bg-primary/20" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
        <span class="material-symbols-outlined text-[1.3rem]">menu_book</span>
        <span>Manage Books</span>
      </a>

      <a routerLink="/admin/categories" routerLinkActive="bg-primary/10 text-primary font-bold dark:bg-primary/20" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
        <span class="material-symbols-outlined text-[1.3rem]">category</span>
        <span>Manage Categories</span>
      </a>

      <a routerLink="/admin/authors" routerLinkActive="bg-primary/10 text-primary font-bold dark:bg-primary/20" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
        <span class="material-symbols-outlined text-[1.3rem]">person_edit</span>
        <span>Manage Authors</span>
      </a>

      <a routerLink="/admin/orders" routerLinkActive="bg-primary/10 text-primary font-bold dark:bg-primary/20" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium">
        <span class="material-symbols-outlined text-[1.3rem]">shopping_cart</span>
        <span>Manage Orders</span>
      </a>
      
      <div class="pt-8">
        <p class="px-2 mb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">System</p>
        <a routerLink="/home" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium group">
          <span class="material-symbols-outlined text-[1.3rem] group-hover:text-primary transition-colors">home</span>
          <span>Return Main Store</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-hidden relative">
    <!-- Content Router Area -->
    <div class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark relative">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
