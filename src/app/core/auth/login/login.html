<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
<div class="auth-scene">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-ornament">✦</div>
      <h2 class="font-serif text-[1.6rem] font-normal text-white tracking-[0.02em]">Welcome Back</h2>
      <p class="mt-1.5 text-[0.8rem] text-muted tracking-[0.03em]">Sign in to continue your reading journey</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="p-8">
      
      <div class="form-group mb-5">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="name@example.com" class="form-input">
        
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
          <p class="text-[#e07070] text-[0.72rem] mt-1.5">Please enter a valid email address</p>
        }
      </div>

      <div class="form-group mb-5">
        <div class="flex justify-between items-center mb-1">
          <label>Password</label>
          <a routerLink="/forget-password" class="text-[0.72rem] text-gold no-underline opacity-80 transition-opacity hover:opacity-100">Forgot password?</a>
        </div>
        <input type="password" formControlName="password" placeholder="••••••••" class="form-input">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-gold">
        Sign In
      </button>

      <p class="text-center pt-5 text-[0.82rem] text-muted">
        Don't have an account? 
        <a routerLink="/register" class="text-gold font-medium no-underline">Create one</a>
      </p>
    </form>
  </div>
</div>
