<section class="p-4 sm:p-6 mb-8 mt-5 h-full space-y-6">
  <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
    <h2 class="text-xl font-bold text-gray-800">Admin Dashboard</h2>
  </div>

  @if (isLoading) {
    <div class="flex justify-center p-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-700"></div>
    </div>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500 mb-1">Total Books</p>
          <h3 class="text-3xl font-bold text-gray-900">{{ stats.books }}</h3>
        </div>
        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500 mb-1">Total Authors</p>
          <h3 class="text-3xl font-bold text-gray-900">{{ stats.authors }}</h3>
        </div>
        <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-green-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500 mb-1">Total Categories</p>
          <h3 class="text-3xl font-bold text-gray-900">{{ stats.categories }}</h3>
        </div>
        <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-purple-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-500 mb-1">Total Orders</p>
          <h3 class="text-3xl font-bold text-gray-900">{{ stats.orders }}</h3>
        </div>
        <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center text-orange-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>
      </div>
    </div>
  }
</section>
