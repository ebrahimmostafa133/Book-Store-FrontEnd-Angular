<section class="py-12 bg-white dark:bg-gray-800 antialiased min-h-screen">
  <div class="max-w-7xl px-4 mx-auto 2xl:px-0">
    <div class="mb-8 border-b border-gray-200 pb-4 dark:border-gray-700 flex justify-between items-end">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white sm:text-4xl">Category Books</h1>
        <p class="mt-2 text-lg text-gray-500 dark:text-gray-400">Explore all books within this category.</p>
      </div>
      <a routerLink="/categories" class="text-blue-600 hover:underline dark:text-blue-500 flex items-center gap-2 mb-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Categories
      </a>
    </div>

    @if (isLoading()) {
      <div class="flex justify-center items-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-700"></div>
      </div>
    } @else {
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        @for (book of books(); track book.id) {
          <div class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800 hover:shadow-lg transition-shadow duration-300 group flex flex-col h-full">
            <div class="h-64 w-full relative mb-4 overflow-hidden rounded-md bg-gray-100 cursor-pointer object-contain">
              <a [routerLink]="['/details', book.id]">
                <img class="mx-auto h-full w-full object-cover group-hover:scale-105 transition-transform duration-300" [src]="book.bookCover" [alt]="book.name" />
              </a>
            </div>
            
            <div class="pt-2 grow flex flex-col justify-between">
              <div>
                <h3 class="text-lg font-semibold leading-tight text-gray-900 hover:underline dark:text-white line-clamp-2">
                  <a [routerLink]="['/details', book.id]">{{ book.name }}</a>
                </h3>
              </div>

              <div class="mt-4 flex items-center justify-between gap-4">
                <p class="text-xl font-extrabold leading-tight text-gray-900 dark:text-white">{{ book.price | currency }}</p>
                <a [routerLink]="['/details', book.id]" class="inline-flex items-center rounded-lg bg-blue-700 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800 transition duration-200">
                  Details
                </a>
              </div>
            </div>
          </div>
        } @empty {
          <div class="col-span-full text-center py-12">
            <div class="text-5xl mb-4 text-gray-300 dark:text-gray-600">
              <i class="fa-solid fa-book-open"></i>
            </div>
            <h3 class="text-xl text-gray-500 dark:text-gray-400">No books found for this category.</h3>
          </div>
        }
      </div>
    }
  </div>
</section>
